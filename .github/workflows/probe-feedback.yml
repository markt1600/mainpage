# One-off diagnostic: exercise the live /api/feedback endpoint from a runner
# with real internet (the build sandbox cannot reach marktan.ai). Runs on
# changes to itself, or manually. Safe: posts one clearly-labelled probe vote
# and one probe note, then GETs the file back.
name: Probe feedback endpoint
on:
  push:
    paths: [".github/workflows/probe-feedback.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Where does each host redirect?
        run: |
          for h in marktan.ai www.marktan.ai; do
            echo "== $h =="
            curl -sSI "https://$h/api/feedback" | grep -i "^HTTP\|^location" || true
          done
      - name: GET following redirects
        run: |
          curl -sSL -o /tmp/get.json -w "final HTTP %{http_code} at %{url_effective}\n" https://www.marktan.ai/api/feedback || true
          head -c 300 /tmp/get.json; echo
      - name: POST probe vote (text/plain, like the magazine)
        run: |
          echo "== POST vote =="
          curl -sS -o /tmp/vote.json -w "HTTP %{http_code}\n" -X POST \
            -H "Content-Type: text/plain" \
            -H "Origin: https://dailymag.marktan.ai" \
            --data '{"type":"vote","issue":"61","desk":"probe","topic":"endpoint probe - safe to ignore","vote":1}' \
            https://www.marktan.ai/api/feedback || true
          cat /tmp/vote.json; echo
      - name: POST probe note
        run: |
          echo "== POST note =="
          curl -sS -o /tmp/note.json -w "HTTP %{http_code}\n" -X POST \
            -H "Content-Type: text/plain" \
            -H "Origin: https://dailymag.marktan.ai" \
            --data '{"type":"note","issue":"61","text":"endpoint probe - safe to ignore"}' \
            https://www.marktan.ai/api/feedback || true
          cat /tmp/note.json; echo
      - name: GET again (did the probe entries land?)
        run: |
          echo "== GET after =="
          curl -sS -o /tmp/get2.json -w "HTTP %{http_code}\n" https://www.marktan.ai/api/feedback || true
          cat /tmp/get2.json; echo
