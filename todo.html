<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>To-Do · The Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4ede0; --paper-2:#ede4d3; --ink:#1c1812; --ink-soft:#5a5142;
    --rule:#d8cdb8; --rule-strong:#b8ab90; --accent:#bb3b22; --accent-deep:#8a2b18;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:Georgia,serif;min-height:100vh}
  .bar{height:5px;background:linear-gradient(90deg,var(--accent),var(--accent-deep))}
  .wrap{max-width:640px;margin:0 auto;padding:22px 18px 60px}
  a{color:inherit}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}
  h1{font-family:"Fraunces",serif;font-weight:800;font-size:34px;margin:2px 0 4px}
  .sub{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-soft);letter-spacing:.04em}
  .panel{border-top:2px solid var(--ink);margin-top:22px;padding-top:14px}
  .lbl{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
  .addrow{display:flex;gap:8px}
  #txt{
    flex:1;font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--ink);
    background:var(--paper-2);border:1px solid var(--rule-strong);border-radius:2px;padding:10px 12px;min-width:0;
  }
  #txt:focus{outline:none;border-color:var(--ink)}
  button{font-family:"JetBrains Mono",monospace;cursor:pointer}
  #txtAdd{
    font-size:12px;letter-spacing:.06em;border:1px solid var(--ink);border-radius:2px;
    background:var(--ink);color:var(--paper);padding:10px 18px;
  }
  #txtAdd:disabled,#mic:disabled{opacity:.5}
  #mic{
    display:block;width:150px;height:150px;border-radius:50%;margin:18px auto 8px;
    border:2px solid var(--rule-strong);background:var(--paper-2);color:var(--ink-soft);
    font-size:13px;letter-spacing:.04em;line-height:1.5;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
  }
  #mic.rec{background:var(--accent);border-color:var(--accent-deep);color:var(--paper);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.05)}}
  #vstat{text-align:center;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-soft);min-height:20px;margin-top:6px}
  #vstat.err{color:var(--accent-deep)}
  .todo-row{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);transition:opacity .35s}
  .todo-chk{
    width:18px;height:18px;border-radius:50%;flex:none;align-self:center;
    border:1.5px solid var(--rule-strong);background:transparent;cursor:pointer;
    padding:0;color:transparent;font-size:11px;line-height:1;
  }
  .todo-chk:hover{border-color:var(--accent);color:var(--accent)}
  .todo-row.done{opacity:.45}
  .todo-row.done .todo-chk{background:var(--accent);border-color:var(--accent);color:var(--paper)}
  .todo-row.done .todo-text{text-decoration:line-through;color:var(--ink-soft)}
  .todo-text{flex:1;font-size:16px;line-height:1.45;min-width:0;overflow-wrap:anywhere}
  .todo-date{font-family:"JetBrains Mono",monospace;font-size:10px;color:#b3a88e;white-space:nowrap;flex:none}
  .todo-x{
    font-size:11px;line-height:1;border:1px solid var(--rule-strong);border-radius:2px;
    background:var(--paper-2);color:var(--ink-soft);padding:4px 8px;flex:none;align-self:center;
  }
  .todo-x:hover{background:var(--accent);color:var(--paper);border-color:var(--accent)}
  .todo-x:disabled{opacity:.4}
  /* ---- shared top navigation (links back into the dashboard) ---- */
  #topnav{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:var(--paper);border-bottom:1px solid var(--rule-strong);
    padding:8px 18px;
  }
  .nav-brand{
    font-family:"Fraunces",serif;font-weight:800;font-size:17px;letter-spacing:-.01em;
    color:var(--ink);text-decoration:none;white-space:nowrap;
  }
  .nav-brand em{font-style:italic;color:var(--accent)}
  .nav-links{
    display:flex;align-items:center;gap:16px;overflow-x:auto;min-width:0;
    font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links a{color:var(--ink-soft);text-decoration:none;white-space:nowrap;padding:3px 0}
  .nav-links a:hover{color:var(--accent-deep)}
  .nav-links a.here{color:var(--accent-deep);border-bottom:2px solid var(--accent)}
  .nav-sep{color:var(--rule-strong)}
  /* phones: wrap onto extra rows instead of sideways scrolling */
  @media(max-width:700px){
    #topnav{align-items:flex-start}
    .nav-links{flex-wrap:wrap;overflow-x:visible;row-gap:6px;column-gap:14px;justify-content:flex-end}
  }
  #gate{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink-soft);margin-top:30px;line-height:1.8}
  #app{display:none}

  /* ---- the stack: Today (white) in front, Next (cream) and Someday
     (kraft) tucked behind; click a tucked card to bring it forward ---- */
  #stack{margin-top:30px}
  .tcard{
    border-radius:16px;padding:18px 22px 24px;
    border:1px solid rgba(40,32,20,.08);
    box-shadow:0 14px 34px rgba(40,32,20,.16), 0 2px 8px rgba(40,32,20,.08);
    transition:margin .25s ease, width .25s ease;
    position:relative;
  }
  .tcard[data-b="today"]{background:#fefdfa;color:#26221b}
  .tcard[data-b="next"]{background:#f3edde;color:#2a251c}
  .tcard[data-b="someday"]{background:#c8b48f;color:#38301f;border-color:rgba(40,32,20,.14)}
  .thead{display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;user-select:none;-webkit-user-select:none}
  .tlabel{font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.1em;color:#8a7f6a}
  .tcard[data-b="someday"] .tlabel{color:#5d5138}
  .tdots{display:grid;grid-template-columns:6px 6px;gap:4px;margin-top:3px}
  .tdots i{width:6px;height:6px;border:1.2px solid rgba(90,80,60,.5);border-radius:50%}
  .tbody{margin-top:10px}
  /* tucked cards: only the header strip shows, narrower, slid up behind */
  .tcard.min{width:94%;margin:0 auto -14px;padding-bottom:16px;z-index:1}
  .tcard.min + .tcard.min{width:97%}
  .tcard.min .tbody{display:none}
  .tcard.front{z-index:3;margin-top:0}
  .tcard .todo-row{border-bottom-color:rgba(40,32,20,.16)}
  .tcard[data-b="someday"] .todo-row{border-bottom-color:rgba(40,32,20,.22)}
  .tcard .todo-chk{background:transparent;border-color:rgba(90,80,60,.5)}
  .tcard .todo-date{color:rgba(90,80,60,.65)}
  .tcard .todo-x{background:transparent;border-color:rgba(90,80,60,.4);color:rgba(90,80,60,.8)}
  .todo-mv{
    font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.04em;line-height:1;
    border:1px solid rgba(90,80,60,.4);border-radius:9px;background:transparent;
    color:rgba(90,80,60,.85);padding:3px 8px;cursor:pointer;flex:none;align-self:center;white-space:nowrap;
  }
  .todo-mv:hover{border-color:rgba(90,80,60,.8)}
  .todo-mv:disabled{opacity:.4}
  .tempty{font-family:"JetBrains Mono",monospace;font-size:11px;color:rgba(90,80,60,.6);padding:8px 0}
</style>
</head>
<body>
<div class="bar"></div>
<nav id="topnav" aria-label="Site">
  <a class="nav-brand" href="/">The <em>Daily</em></a>
  <div class="nav-links">
    <a href="/#marketsSec">Markets</a>
    <a href="/#newsSec">News</a>
    <a href="/#weatherSec">Weather</a>
    <a href="/#eventsSec">Events</a>
    <a href="/#holidaysSec">Holidays</a>
    <span class="nav-sep">·</span>
    <a href="/#privateSec">Private</a>
    <a href="/#todoBlock" class="here">To-Do</a>
    <a href="/admin">Admin</a>
  </div>
</nav>
<div class="wrap">
  <a href="/" style="text-decoration:none">
    <div class="eyebrow">marktan.ai · the daily</div>
    <h1>To-Do</h1>
  </a>

  <div id="gate">checking your login…</div>

  <div id="app">
    <div class="panel">
      <div class="lbl">Type it <span id="addTo1" style="text-transform:none;letter-spacing:.04em"></span></div>
      <div class="addrow">
        <input id="txt" type="text" placeholder="e.g. renew passport" autocomplete="off" maxlength="500">
        <button id="txtAdd">Add</button>
      </div>
    </div>

    <div class="panel">
      <div class="lbl">Or say it <span id="addTo2" style="text-transform:none;letter-spacing:.04em"></span></div>
      <button id="mic" type="button">🎙<br>hold to<br>record</button>
      <div id="vstat">hold the button, speak, release — it transcribes and adds itself</div>
    </div>

    <div id="stack"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let SESSION = null;
let TODOS = [];

function vstat(msg, err){ const el = $("vstat"); el.textContent = msg; el.className = err ? "err" : ""; }

/* ---------- auth: the dashboard's Google-login session unlocks this page ---------- */
(async function boot(){
  try{ SESSION = localStorage.getItem("ownerSession") || null; }catch(e){}
  if(SESSION){
    try{
      const r = await fetch("/api/login", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ session: SESSION }) });
      if(!r.ok) SESSION = null;
    }catch(e){ SESSION = null; }
  }
  if(!SESSION){
    $("gate").innerHTML = 'This page is for the owner. <a href="/">Log in on the dashboard</a> first, then come back.';
    return;
  }
  $("gate").style.display = "none";
  $("app").style.display = "block";
  loadList();
})();

function authFetch(url, opts){
  opts = opts || {};
  return fetch(url, { ...opts, headers: { ...(opts.headers||{}), authorization: "Bearer " + SESSION } });
}

/* ---------- list ---------- */
async function loadList(){
  try{
    const d = await authFetch("/api/todos", { cache:"no-store" }).then(r=>r.json());
    TODOS = Array.isArray(d.todos) ? d.todos : [];
    render();
  }catch(e){}
}
const BUCKETS = ["today","next","someday"];
const LABELS = { today:"Today", next:"Next", someday:"Someday" };
let ACTIVE = "today";
const bucketOf = (t) => BUCKETS.includes(t && t.bucket) ? t.bucket : "today";
const nextB = (b) => BUCKETS[(BUCKETS.indexOf(b)+1) % BUCKETS.length];

function todoDate(ts){
  if(!Number.isFinite(ts)) return "";
  const d = new Date(ts);
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return new Intl.DateTimeFormat("en-GB", { timeZone:"Asia/Singapore", day:"numeric", month:"short", ...(sameYear ? {} : { year:"numeric" }) }).format(d);
}
function render(){
  // Fixed sheet order (Someday at the back, like the pad): tucked cards
  // show just their header strip; the ACTIVE card comes to the front.
  const order = BUCKETS.filter(b=>b!==ACTIVE).reverse().concat([ACTIVE]); // e.g. someday, next, today
  $("stack").innerHTML = order.map(b=>{
    const rows = TODOS.map((t,i)=>({t,i})).filter(r=>bucketOf(r.t)===b);
    const front = b === ACTIVE;
    const items = rows.length
      ? rows.map(({t,i})=>`<div class="todo-row"><button class="todo-chk" data-i="${i}" title="Tick off">✓</button><span class="todo-text">${esc(t.text)}</span><span class="todo-date">${todoDate(t.ts)}</span><button class="todo-mv" data-i="${i}" title="Move to ${LABELS[nextB(b)]}">→ ${nextB(b)}</button><button class="todo-x" data-i="${i}" title="Delete">✕</button></div>`).join("")
      : `<div class="tempty">Nothing in ${LABELS[b].toLowerCase()}.</div>`;
    return `<div class="tcard ${front?"front":"min"}" data-b="${b}">
      <div class="thead" data-b="${b}" title="${front?"":"Bring "+LABELS[b]+" to the front"}">
        <span class="tlabel">${LABELS[b]}${rows.length?` · ${rows.length}`:""}</span>
        <span class="tdots"><i></i><i></i><i></i><i></i></span>
      </div>
      <div class="tbody">${items}</div>
    </div>`;
  }).join("");
  $("addTo1").textContent = `· adds to ${LABELS[ACTIVE]}`;
  $("addTo2").textContent = `· adds to ${LABELS[ACTIVE]}`;
  document.querySelectorAll(".thead").forEach(h=>h.addEventListener("click", ()=>{
    if(h.dataset.b !== ACTIVE){ ACTIVE = h.dataset.b; render(); }
  }));
  document.querySelectorAll(".todo-x").forEach(b=>b.addEventListener("click", ()=>del(+b.dataset.i, b)));
  document.querySelectorAll(".todo-mv").forEach(b=>b.addEventListener("click", ()=>move(+b.dataset.i, b)));
  document.querySelectorAll(".todo-chk").forEach(b=>b.addEventListener("click", ()=>{
    b.closest(".todo-row").classList.add("done");
    setTimeout(()=>del(+b.dataset.i, b), 450);
  }));
}

async function move(i, btn){
  const victim = TODOS[i]; if(!victim) return;
  const to = nextB(bucketOf(victim));
  if(btn) btn.disabled = true;
  try{
    const cur = await authFetch("/api/todos", { cache:"no-store" }).then(r=>r.json());
    const list = (cur.todos||[]).map(x=>(x && x.text===victim.text && x.ts===victim.ts) ? { ...x, bucket: to } : x);
    const res = await authFetch("/api/todos", {
      method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ todos: list, sha: cur.sha }),
    });
    if(!res.ok) throw new Error("save failed");
    TODOS = list; render();
  }catch(e){ if(btn) btn.disabled = false; }
}
async function add(text){
  const res = await authFetch("/api/todos", {
    method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ add: text, bucket: ACTIVE }),
  });
  if(!res.ok) throw new Error((await res.json().catch(()=>({}))).error || `error ${res.status}`);
  await loadList();
}
async function del(i, btn){
  const victim = TODOS[i]; if(!victim) return;
  if(btn) btn.disabled = true;
  try{
    const cur = await authFetch("/api/todos", { cache:"no-store" }).then(r=>r.json());
    const list = (cur.todos||[]).filter(x=>!(x && x.text===victim.text && x.ts===victim.ts));
    const res = await authFetch("/api/todos", {
      method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ todos: list, sha: cur.sha }),
    });
    if(!res.ok) throw new Error("save failed");
    TODOS = list; render();
  }catch(e){ if(btn) btn.disabled = false; }
}

/* ---------- text add ---------- */
async function submitText(){
  const v = $("txt").value.trim(); if(!v) return;
  $("txt").disabled = true; $("txtAdd").disabled = true;
  try{ await add(v); $("txt").value = ""; }
  catch(e){ vstat("couldn't save — " + (e.message || e), true); }
  finally{ $("txt").disabled = false; $("txtAdd").disabled = false; $("txt").focus(); }
}
$("txtAdd").addEventListener("click", submitText);
$("txt").addEventListener("keydown", (e)=>{ if(e.key === "Enter") submitText(); });

/* ---------- hold-to-record voice add ----------
   Hold: getUserMedia + MediaRecorder. Release: stop, POST the clip to
   /api/transcribe (ElevenLabs Scribe server-side), then add the text.
   Safari records audio/mp4; Chrome audio/webm — we send whatever the
   recorder produced. */
let rec = null, chunks = [], recStart = 0, stream = null;

function recMime(){
  if(window.MediaRecorder){
    for(const m of ["audio/webm;codecs=opus","audio/webm","audio/mp4"]){
      if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
    }
  }
  return "";
}

async function startRec(e){
  e.preventDefault();
  if(rec) return;
  if(!navigator.mediaDevices || !window.MediaRecorder){ vstat("recording isn't supported in this browser", true); return; }
  try{
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(err){ vstat("microphone permission denied", true); return; }
  chunks = [];
  const m = recMime();
  rec = m ? new MediaRecorder(stream, { mimeType: m }) : new MediaRecorder(stream);
  rec.ondataavailable = (ev)=>{ if(ev.data && ev.data.size) chunks.push(ev.data); };
  rec.onstop = onRecStop;
  recStart = Date.now();
  rec.start();
  $("mic").classList.add("rec");
  vstat("recording — release to add");
}

function stopRec(e){
  if(e) e.preventDefault();
  if(!rec) return;
  $("mic").classList.remove("rec");
  try{ rec.stop(); }catch(err){ cleanupRec(); }
}

function cleanupRec(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
  rec = null;
}

async function onRecStop(){
  const dur = Date.now() - recStart;
  const mime = (rec && rec.mimeType) || recMime() || "audio/webm";
  cleanupRec();
  if(dur < 400 || !chunks.length){ vstat("too short — hold while you speak"); return; }
  vstat("transcribing…");
  $("mic").disabled = true;
  try{
    const blob = new Blob(chunks, { type: mime });
    const b64 = await new Promise((res, rej)=>{
      const rd = new FileReader();
      rd.onload = ()=>res(String(rd.result).split(",")[1]);
      rd.onerror = rej;
      rd.readAsDataURL(blob);
    });
    const r = await authFetch("/api/transcribe", {
      method:"POST", headers:{ "content-type":"application/json" },
      body: JSON.stringify({ audio: b64, mime: mime.split(";")[0] }),
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || `error ${r.status}`);
    vstat(`adding: “${j.text}”`);
    await add(j.text);
    vstat(`✓ added: “${j.text}”`);
  }catch(err){ vstat(String(err.message || err), true); }
  finally{ $("mic").disabled = false; }
}

$("mic").addEventListener("pointerdown", startRec);
$("mic").addEventListener("pointerup", stopRec);
$("mic").addEventListener("pointercancel", stopRec);
$("mic").addEventListener("pointerleave", (e)=>{ if(rec) stopRec(e); });
$("mic").addEventListener("contextmenu", (e)=>e.preventDefault());
</script>
</body>
</html>
